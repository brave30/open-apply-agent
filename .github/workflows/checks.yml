name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/generate-fixtures.mjs
      - run: git diff --exit-code -- ../fixtures/applications.json ../supabase/migrations/202610210002_catalog.sql
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: git clone https://github.com/OpenWebRL/OpenWebRL.git vendor/OpenWebRL
      - run: git -C vendor/OpenWebRL checkout 9a120949aca3e58a2628f4b4e6edd0474d984873
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
